<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Game ❤️</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 15% 20%, #ff4fa3, transparent 25%),
        radial-gradient(circle at 85% 80%, #6c63ff, transparent 25%),
        linear-gradient(135deg, #16001f, #4b0b45, #12002b);
}


/* =========================
   SCREEN
========================= */

.screen {
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   CARD
========================= */

.card {
    width: 360px;
    min-height: 310px;

    padding: 40px 30px;

    text-align: center;

    border-radius: 25px;

    background: rgba(255,255,255,0.13);

    backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.25);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
}


/* =========================
   PASSWORD
========================= */

h1 {
    margin-top: 0;
    margin-bottom: 25px;

    font-size: 28px;
}

input {
    width: 100%;

    padding: 14px;

    border: none;
    outline: none;

    border-radius: 12px;

    text-align: center;

    font-size: 18px;

    margin-bottom: 7px;
}

.small {
    font-size: 12px;

    opacity: 0.7;

    margin-bottom: 15px;

    text-align: center;
}

button {
    border: none;

    border-radius: 12px;

    padding: 13px 25px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.enter {
    width: 100%;

    background: #ff4fa3;

    color: white;
}

.error {
    margin-top: 12px;

    font-size: 13px;

    color: #ffd0e8;
}


/* =========================
   LOVE PAGE
========================= */

#lovePage {
    display: none;
}

.heart {
    font-size: 60px;

    margin-bottom: 15px;

    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

.question {
    font-size: 30px;

    font-weight: bold;

    margin-bottom: 30px;
}

.game-area {
    width: 100%;
    height: 100px;

    position: relative;
}

.yes {
    background: #ff4f91;

    color: white;
}


/* =========================
   NO BUTTON
========================= */

.no {
    position: fixed;

    left: 50%;
    top: 55%;

    background: white;

    color: black;

    z-index: 5000;

    transition:
        left 0.15s ease,
        top 0.15s ease;
}


/* =========================
   CELEBRATION SCREEN
========================= */

#celebration {
    display: none;

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #ff4fa3,
            #7b176b 45%,
            #16001f 100%
        );

    z-index: 10000;

    overflow: hidden;
}


/* =========================
   LOVE MESSAGE
========================= */

#loveMessage {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    width: 90%;

    text-align: center;

    font-size: 36px;

    font-weight: bold;

    color: white;

    text-shadow:
        0 0 10px white,
        0 0 25px #ff4fa3,
        0 0 50px #ff4fa3;

    z-index: 20000;

    animation:
        messagePop 0.9s ease forwards;
}

@keyframes messagePop {

    0% {
        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    60% {
        transform:
            translate(-50%, -50%)
            scale(1.25);

        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }
}


/* =========================
   CENTER PARTICLES
========================= */

.particle {

    position: fixed;

    left: 50%;
    top: 50%;

    pointer-events: none;

    z-index: 15000;

    animation:
        centerBlast 1.8s ease-out forwards;
}

@keyframes centerBlast {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0)
            rotate(0deg);

        opacity: 1;
    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.4)
            rotate(var(--rotate));

        opacity: 0;
    }
}


/* =========================
   CORNER PAPER BLAST
========================= */

.cornerParticle {

    position: fixed;

    pointer-events: none;

    z-index: 16000;

    width: 12px;
    height: 20px;

    animation:
        cornerBlast 1.8s ease-out forwards;
}

@keyframes cornerBlast {

    0% {

        transform:
            translate(0, 0)
            rotate(0deg)
            scale(0);

        opacity: 1;
    }

    100% {

        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(var(--rotate))
            scale(1);

        opacity: 0;
    }
}


/* =========================
   FLASH
========================= */

#flash {

    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 19000;
}

.flashAnimation {
    animation: flashEffect 0.45s ease-out;
}

@keyframes flashEffect {

    0% {
        opacity: 0.9;
    }

    100% {
        opacity: 0;
    }
}

</style>

</head>


<body>


<!-- =========================
     PASSWORD PAGE
========================= -->

<div
    class="screen"
    id="passwordPage"
>

    <div class="card">

        <h1>
            🔐 Enter Password
        </h1>

        <input
            type="password"
            id="password"
            inputmode="numeric"
            maxlength="10"
            placeholder="Enter numbers only"
        >

        <div class="small">
            DOB
        </div>

        <button
            class="enter"
            onclick="checkPassword()"
        >
            ENTER
        </button>

        <div
            class="error"
            id="error"
        ></div>

    </div>

</div>



<!-- =========================
     LOVE PAGE
========================= -->

<div
    class="screen"
    id="lovePage"
>

    <div class="card">

        <div class="heart">
            ❤️
        </div>

        <div class="question">
            Do you love me?
        </div>

        <div class="game-area">

            <button
                class="yes"
                onclick="yesClicked()"
            >
                YES ❤️
            </button>

            <button
                class="no"
                id="noButton"
                onmouseover="runAway()"
                onclick="runAway()"
            >
                NO 😏
            </button>

        </div>

    </div>

</div>



<!-- =========================
     CELEBRATION
========================= -->

<div id="celebration">

    <div id="loveMessage">
        I love you too 💋❤️💞
    </div>

</div>


<!-- FLASH -->

<div id="flash"></div>



<script>


/* =========================
   PASSWORD
========================= */

const correctPassword = "1002";


function checkPassword() {

    const password =
        document.getElementById(
            "password"
        ).value;

    const error =
        document.getElementById(
            "error"
        );


    if (
        !/^[0-9]+$/.test(password)
    ) {

        error.innerText =
            "Please enter numbers only 😅";

        return;
    }


    if (
        password === correctPassword
    ) {

        document.getElementById(
            "passwordPage"
        ).style.display =
            "none";

        document.getElementById(
            "lovePage"
        ).style.display =
            "flex";

    }

    else {

        error.innerText =
            "Wrong password 😜 Try again!";

    }

}



/* =========================
   NO BUTTON
========================= */

function runAway() {

    const button =
        document.getElementById(
            "noButton"
        );


    const margin = 25;


    const maxX =
        window.innerWidth -
        button.offsetWidth -
        margin;


    const maxY =
        window.innerHeight -
        button.offsetHeight -
        margin;


    const x =
        margin +
        Math.random() *
        (
            maxX -
            margin
        );


    const y =
        margin +
        Math.random() *
        (
            maxY -
            margin
        );


    button.style.left =
        x + "px";

    button.style.top =
        y + "px";
}



/* =========================
   YES
========================= */

function yesClicked() {


    /* Hide complete love page */

    document.getElementById(
        "lovePage"
    ).style.display =
        "none";


    /* Show celebration */

    const celebration =
        document.getElementById(
            "celebration"
        );


    celebration.style.display =
        "block";


    /* Flash */

    const flash =
        document.getElementById(
            "flash"
        );


    flash.classList.add(
        "flashAnimation"
    );


    setTimeout(
        function() {

            flash.classList.remove(
                "flashAnimation"
            );

        },
        500
    );


    /* Center blast */

    centerBlast();


    /* Four corner blasts */

    cornerBlast(
        0,
        0,
        "top-left"
    );

    cornerBlast(
        window.innerWidth,
        0,
        "top-right"
    );

    cornerBlast(
        0,
        window.innerHeight,
        "bottom-left"
    );

    cornerBlast(
        window.innerWidth,
        window.innerHeight,
        "bottom-right"
    );

}



/* =========================
   CENTER BLAST
========================= */

function centerBlast() {


    const emojis = [

        "❤️",
        "💖",
        "💞",
        "💋",
        "✨",
        "💕",
        "🥰",
        "💗",
        "💓",
        "🌟"

    ];


    for (
        let i = 0;
        i < 120;
        i++
    ) {


        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.innerText =
            emojis[
                Math.floor(
                    Math.random() *
                    emojis.length
                )
            ];


        particle.style.fontSize =
            (
                16 +
                Math.random() * 28
            ) + "px";


        particle.style.setProperty(
            "--x",
            (
                Math.random() * 2 - 1
            ) * 650 + "px"
        );


        particle.style.setProperty(
            "--y",
            (
                Math.random() * 2 - 1
            ) * 650 + "px"
        );


        particle.style.setProperty(
            "--rotate",
            (
                Math.random() * 720 -
                360
            ) + "deg"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            function() {

                particle.remove();

            },
            1900
        );

    }

}



/* =========================
   CORNER BLAST
========================= */

function cornerBlast(
    startX,
    startY,
    corner
) {


    const colors = [

        "#ff4fa3",
        "#ffffff",
        "#ffd166",
        "#7df9ff",
        "#c77dff",
        "#ff6b6b"

    ];


    for (
        let i = 0;
        i < 45;
        i++
    ) {


        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "cornerParticle";


        particle.style.left =
            startX + "px";


        particle.style.top =
            startY + "px";


        particle.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        particle.style.width =
            (
                6 +
                Math.random() * 10
            ) + "px";


        particle.style.height =
            (
                8 +
                Math.random() * 18
            ) + "px";


        let x;
        let y;


        /*
           Direction depends on corner
        */


        if (
            corner === "top-left"
        ) {

            x =
                50 +
                Math.random() *
                500;

            y =
                50 +
                Math.random() *
                500;

        }


        else if (
            corner === "top-right"
        ) {

            x =
                -50 -
                Math.random() *
                500;

            y =
                50 +
                Math.random() *
                500;

        }


        else if (
            corner === "bottom-left"
        ) {

            x =
                50 +
                Math.random() *
                500;

            y =
                -50 -
                Math.random() *
                500;

        }


        else {

            x =
                -50 -
                Math.random() *
                500;

            y =
                -50 -
                Math.random() *
                500;

        }


        particle.style.setProperty(
            "--x",
            x + "px"
        );


        particle.style.setProperty(
            "--y",
            y + "px"
        );


        particle.style.setProperty(
            "--rotate",
            (
                Math.random() * 720 -
                360
            ) + "deg"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            function() {

                particle.remove();

            },
            1900
        );

    }

}

</script>

</body>

</html>
