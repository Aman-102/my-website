<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Game ❤️</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

    overflow: hidden;

    font-family: Arial, sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 20% 20%,
            #ff4fa3,
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 80%,
            #6c63ff,
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #16001f,
            #4b0b45,
            #12002b
        );
}


/* =========================
   SCREEN
========================= */

.screen {

    width: 100%;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;
}


/* =========================
   CARD
========================= */

.card {

    width: 360px;
    min-height: 310px;

    padding: 40px 30px;

    text-align: center;

    border-radius: 25px;

    background:
        rgba(255,255,255,0.13);

    backdrop-filter: blur(15px);

    border:
        1px solid rgba(255,255,255,0.25);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
}


/* =========================
   PASSWORD PAGE
========================= */

h1 {

    margin-top: 0;
    margin-bottom: 25px;

    font-size: 28px;
}


input {

    width: 100%;

    padding: 14px;

    border: none;

    outline: none;

    border-radius: 12px;

    text-align: center;

    font-size: 18px;

    margin-bottom: 7px;
}


.small {

    font-size: 12px;

    opacity: 0.7;

    margin-bottom: 15px;

    text-align: center;
}


button {

    border: none;

    border-radius: 12px;

    padding: 13px 25px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: transform 0.2s;
}


button:hover {

    transform: scale(1.05);
}


.enter {

    width: 100%;

    background: #ff4fa3;

    color: white;
}


.error {

    margin-top: 12px;

    font-size: 13px;

    color: #ffd0e8;
}


/* =========================
   LOVE PAGE
========================= */

#lovePage {

    display: none;
}


.heart {

    font-size: 60px;

    margin-bottom: 15px;

    animation:
        heartbeat 1s infinite;
}


@keyframes heartbeat {

    0%,
    100% {

        transform: scale(1);
    }

    50% {

        transform: scale(1.15);
    }
}


.question {

    font-size: 30px;

    font-weight: bold;

    margin-bottom: 30px;
}


.game-area {

    position: relative;

    width: 100%;

    height: 100px;
}


.yes {

    background: #ff4f91;

    color: white;
}


/* =========================
   NO BUTTON
========================= */

.no {

    position: fixed;

    left: 50%;
    top: 55%;

    background: white;

    color: black;

    z-index: 5000;
}


/* =========================
   LOVE POPUP
========================= */

#successPopup {

    display: none;

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    width: 90%;

    text-align: center;

    font-size: 34px;

    font-weight: bold;

    color: white;

    z-index: 99999;

    text-shadow:
        0 0 10px #ff4fa3,
        0 0 25px #ff4fa3,
        0 0 40px white;

    animation:
        popupLove 0.8s ease forwards;
}


@keyframes popupLove {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    60% {

        transform:
            translate(-50%, -50%)
            scale(1.25);

        opacity: 1;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }
}


/* =========================
   BURST PARTICLES
========================= */

.particle {

    position: fixed;

    left: 50%;
    top: 50%;

    font-size: 28px;

    pointer-events: none;

    z-index: 99998;

    animation:
        burst 1.6s ease-out forwards;
}


@keyframes burst {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 1;
    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--rotate))
            scale(1.5);

        opacity: 0;
    }
}


/* =========================
   BACKGROUND HEARTS
========================= */

.bg-heart {

    position: fixed;

    bottom: -50px;

    font-size: 22px;

    opacity: 0.15;

    pointer-events: none;

    animation:
        floatHeart 7s linear infinite;
}


@keyframes floatHeart {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

    }

    100% {

        transform:
            translateY(-110vh)
            rotate(360deg);

    }
}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND HEARTS
========================= -->

<div
    class="bg-heart"
    style="left:10%; animation-delay:0s;"
>
    ❤️
</div>

<div
    class="bg-heart"
    style="left:30%; animation-delay:2s;"
>
    💖
</div>

<div
    class="bg-heart"
    style="left:50%; animation-delay:4s;"
>
    💞
</div>

<div
    class="bg-heart"
    style="left:70%; animation-delay:1s;"
>
    ❤️
</div>

<div
    class="bg-heart"
    style="left:90%; animation-delay:3s;"
>
    💗
</div>



<!-- =========================
     PASSWORD PAGE
========================= -->

<div
    class="screen"
    id="passwordPage"
>

    <div class="card">

        <h1>
            🔐 Enter Password
        </h1>


        <input
            type="password"
            id="password"
            inputmode="numeric"
            maxlength="10"
            placeholder="Enter numbers only"
        >


        <div class="small">
            DOB
        </div>


        <button
            class="enter"
            onclick="checkPassword()"
        >
            ENTER
        </button>


        <div
            class="error"
            id="error"
        ></div>

    </div>

</div>



<!-- =========================
     LOVE PAGE
========================= -->

<div
    class="screen"
    id="lovePage"
>

    <div class="card">

        <div class="heart">
            ❤️
        </div>


        <div class="question">
            Do you love me?
        </div>


        <div class="game-area">

            <button
                class="yes"
                onclick="yesClicked()"
            >
                YES ❤️
            </button>


            <button
                class="no"
                id="noButton"
                onmouseover="runAway()"
                onclick="runAway()"
            >
                NO 😏
            </button>

        </div>

    </div>

</div>



<!-- =========================
     POPUP
========================= -->

<div id="successPopup">

    I love you too 💋❤️💞

</div>



<script>

/* =========================
   PASSWORD
========================= */

/* Change 1234 to your password */

const correctPassword = "1002";


function checkPassword() {

    const password =
        document.getElementById(
            "password"
        ).value;


    const error =
        document.getElementById(
            "error"
        );


    /* Only numbers */

    if (
        !/^[0-9]+$/.test(password)
    ) {

        error.innerText =
            "Please enter numbers only 😅";

        return;
    }


    /* Correct password */

    if (
        password === correctPassword
    ) {

        document.getElementById(
            "passwordPage"
        ).style.display =
            "none";


        document.getElementById(
            "lovePage"
        ).style.display =
            "flex";

    }

    else {

        error.innerText =
            "Wrong password 😜 Try again!";

    }

}



/* =========================
   NO BUTTON
   FULL SCREEN MOVEMENT
========================= */

function runAway() {

    const button =
        document.getElementById(
            "noButton"
        );


    const margin = 20;


    const maxX =
        window.innerWidth -
        button.offsetWidth -
        margin;


    const maxY =
        window.innerHeight -
        button.offsetHeight -
        margin;


    const x =
        margin +
        Math.random() *
        (
            maxX -
            margin
        );


    const y =
        margin +
        Math.random() *
        (
            maxY -
            margin
        );


    button.style.left =
        x + "px";


    button.style.top =
        y + "px";
}



/* =========================
   YES BUTTON
========================= */

function yesClicked() {


    /* Hide NO */

    document.getElementById(
        "noButton"
    ).style.display =
        "none";


    /* Show popup */

    const popup =
        document.getElementById(
            "successPopup"
        );


    popup.style.display =
        "block";


    /* Emoji list */

    const emojis = [

        "❤️",
        "💖",
        "💞",
        "💋",
        "✨",
        "💕",
        "🥰",
        "💗",
        "💓",
        "🌟"

    ];


    /* Create 100 particles */

    for (
        let i = 0;
        i < 100;
        i++
    ) {


        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.innerText =
            emojis[
                Math.floor(
                    Math.random() *
                    emojis.length
                )
            ];


        /* Random direction */

        const x =
            (
                Math.random() * 2 - 1
            ) * 600;


        const y =
            (
                Math.random() * 2 - 1
            ) * 600;


        const rotate =
            (
                Math.random() * 720 -
                360
            ) + "deg";


        particle.style.setProperty(
            "--x",
            x + "px"
        );


        particle.style.setProperty(
            "--y",
            y + "px"
        );


        particle.style.setProperty(
            "--rotate",
            rotate
        );


        /* Random size */

        particle.style.fontSize =
            (
                18 +
                Math.random() * 28
            ) + "px";


        document.body.appendChild(
            particle
        );


        /* Remove after animation */

        setTimeout(
            function() {

                particle.remove();

            },
            1700
        );

    }

}

</script>

</body>

</html>
